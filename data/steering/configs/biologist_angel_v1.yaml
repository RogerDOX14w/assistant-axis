# biologist_angel_v1 -- angel/demon role-pair axis (May 2026)
#
# Part of the post-Phase-0 49-axis first-role expansion (all-mode only).
# Convention: role_from = pos pole, role_to = neg pole; sign=+1 steers
# toward neg.  Good-pole convention pos=angel (virtuous), neg=demon.
#
# Role pair (not a trait pair): the axis vector is derived from
# data/roles/instructions/angel.json vs data/roles/instructions/demon.json
# rather than trait JSONs.  Biologist is the first-listed base-persona
# candidate (|μ|=0.00, n=4) -- non-goal-pool for the goal-axis convention.

experiment_id: biologist_angel_v1
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/roles/vectors
  role_from: angel
  role_to: demon

persona:
  type: role
  role: biologist
  prompt_index: 0

cells:
  - { slot: 6, layer: 25 }
  - { slot: 6, layer: 49 }
  - { slot: 7, layer: 25 }
  - { slot: 7, layer: 49 }
  - { slot: 0, layer: 25 }
  - { slot: 0, layer: 31 }
  - { slot: 0, layer: 49 }

sweep:
  weakest_strength: 1.0
  max_strength: 256.0
  multiplier: 1.189
  start_strength_multiplier_steps: 2
  signs: [+1, -1]

positions_mode: all
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/biologist_angel_v1.json
