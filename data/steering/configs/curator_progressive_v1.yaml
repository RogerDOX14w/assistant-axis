# curator_progressive_v1 -- second-role steering sweep (May 2026)
#
# Part of the 12-axis second-role batch (one per axis from the 12 v2
# axes).  Each axis is paired with the second-role base persona from
# roger/axis_judge_experiments/base_persona_candidates.txt -- an
# un-virtuous-aligned persona that gives the steering vector real
# headroom on the un-RLHF-preferred pole (which the first-role/
# virtuous-persona sweeps lack because RLHF training has the virtuous
# pole nearly saturated).
# Convention: role_from = pos pole (progressive), role_to = neg pole (conservative);
# sign=+1 steers toward conservative, the bidirectional rubric scores +eff
# toward conservative.
#
# all-mode only per the 2026-05-22 plan; the prefill comparison is
# only run on the 10+2 first-role axes since the prefill efficacy gap
# was already characterised in Phase 0 (post-Phase-0 plots confirm
# prefill ~half the all-mode effect even at 5-8x larger steering
# coefficients).

experiment_id: curator_progressive_v1
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/traits/vectors
  role_from: progressive
  role_to: conservative

persona:
  type: role
  role: curator
  prompt_index: 0

cells:
  - { slot: 6, layer: 25 }
  - { slot: 6, layer: 49 }
  - { slot: 7, layer: 25 }
  - { slot: 7, layer: 49 }
  - { slot: 0, layer: 25 }
  - { slot: 0, layer: 31 }
  - { slot: 0, layer: 49 }

sweep:
  weakest_strength: 1.0
  max_strength: 256.0
  multiplier: 1.189
  signs: [+1, -1]

positions_mode: all
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/curator_progressive_v1.json
