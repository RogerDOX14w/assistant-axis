# researcher_predator_v1 -- predator/prey role-pair axis (May 2026)
# Convention pos=predator, neg=prey (neither pole carries clear good/bad
# valence per pair_list_clean.json note).  YAML sets role_from=predator,
# role_to=prey; sign=+1 steers toward prey.

experiment_id: researcher_predator_v1
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/roles/vectors
  role_from: predator
  role_to: prey

persona:
  type: role
  role: researcher
  prompt_index: 0

cells:
  - { slot: 6, layer: 25 }
  - { slot: 6, layer: 49 }
  - { slot: 7, layer: 25 }
  - { slot: 7, layer: 49 }
  - { slot: 0, layer: 25 }
  - { slot: 0, layer: 31 }
  - { slot: 0, layer: 49 }

sweep:
  weakest_strength: 1.0
  max_strength: 256.0
  multiplier: 1.189
  start_strength_multiplier_steps: 2
  signs: [+1, -1]

positions_mode: all
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/researcher_predator_v1.json
