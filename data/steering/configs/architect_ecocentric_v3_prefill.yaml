# architect_ecocentric_v3 -- multi-cell ecocentric/anthropocentric sweep (May 2026)
#
# Part of the 12-axis batch: same cell grid + bidirectional scan + new
# question sets (see roger/axis_judge_experiments/question_set_v1_summary.md).
# Convention: role_from = pos pole, role_to = neg pole, so sign=+1 steers
# toward the neg pole and the bidirectional rubric scores +eff toward neg.
#
# Prefill-only sibling of architect_ecocentric_v3.yaml: identical cells / questions /
# axis / persona / sweep params; only positions_mode differs
# ("prefill_only" vs "all" in the parent config).  Output dir is
# <experiment_id>/ so results don't collide with the all-positions run.

experiment_id: architect_ecocentric_v3_prefill
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/traits/vectors
  role_from: ecocentric
  role_to: anthropocentric

persona:
  type: role
  role: architect
  prompt_index: 0

cells:
  - { slot: 6, layer: 25 }
  - { slot: 6, layer: 49 }
  - { slot: 7, layer: 25 }
  - { slot: 7, layer: 49 }
  - { slot: 0, layer: 25 }
  - { slot: 0, layer: 31 }
  - { slot: 0, layer: 49 }

sweep:
  # scan_mode defaults to "bidirectional" (May 2026 default)
  weakest_strength: 1.0
  max_strength: 16.0
  multiplier: 1.189
  signs: [+1, -1]

positions_mode: prefill_only
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/architect_ecocentric_v3.json
