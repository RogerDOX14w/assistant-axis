# caregiver_confident_v1 -- confident/uncertain axis (May 2026)
#
# Part of the post-Phase-0 49-axis first-role expansion (all-mode only).
# Convention: role_from = pos pole, role_to = neg pole; sign=+1 steers
# toward neg.  Good-pole convention pos=confident, neg=uncertain.
#
# Caregiver is the first-listed base-persona candidate (|μ|=1.25, n=4).
# Non-goal axis; expect roughly symmetric dose-response on both signs.

experiment_id: caregiver_confident_v1
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/traits/vectors
  role_from: confident
  role_to: uncertain

persona:
  type: role
  role: caregiver
  prompt_index: 0

cells:
  - { slot: 6, layer: 25 }
  - { slot: 6, layer: 49 }
  - { slot: 7, layer: 25 }
  - { slot: 7, layer: 49 }
  - { slot: 0, layer: 25 }
  - { slot: 0, layer: 31 }
  - { slot: 0, layer: 49 }

sweep:
  weakest_strength: 1.0
  max_strength: 256.0
  multiplier: 1.189
  start_strength_multiplier_steps: 2
  signs: [+1, -1]

positions_mode: all
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/caregiver_confident_v1.json
