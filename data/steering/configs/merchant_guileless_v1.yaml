# Merchant + guileless/scheming steering.
#
# Guileless merchant: transparent, fair dealer, tells you the honest price.
# Scheming merchant: shrewd, conceals real position, exploits information
# asymmetry, manufactures leverage.
#
# 10 questions from merchant role + scheming/guileless trait sets,
# chosen for scenarios where both poles give coherent but distinct advice.

experiment_id: merchant_guileless_v1
model_name: Qwen/Qwen3-32B
output_dir: /workspace/outputs/qwen-3-32b/steering

axis_source:
  type: role_transplant
  vectors_dir: /workspace/outputs/qwen-3-32b/traits/vectors
  role_from: guileless
  role_to: scheming

persona:
  type: role
  role: merchant
  prompt_index: 0

cells:
  - { slot: 3, layer: 25 }

sweep:
  weakest_strength: 1.0
  max_strength: 16.0
  multiplier: 1.189
  signs: [+1, -1]

positions_mode: all
batch_size: 4
max_new_tokens: 512

questions_file: data/steering/questions/merchant_guileless_v1.json
